services:
  motis:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MOTIS_VERSION: ${MOTIS_VERSION:-v2.7.0}
    restart: unless-stopped
    depends_on:
      motis-updater:
        condition: service_started
    ports:
      - "${MOTIS_PORT:-8080}:8080"
    environment:
      MOTIS_CONFIG: /var/lib/motis/config.yml
    volumes:
      - ./out:/var/lib/motis
  motis-updater:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MOTIS_VERSION: ${MOTIS_VERSION:-v2.7.0}
    restart: unless-stopped
    environment:
      OUT_DIR: /var/lib/motis
      MOTIS_CONFIG: /var/lib/motis/config.yml
      UPDATE_TZ: ${UPDATE_TZ:-UTC}
      UPDATE_CRON: ${UPDATE_CRON:-0 2 * * *}
      RUN_ON_START: ${RUN_ON_START:-true}
      REGIONS: ${REGIONS:-}
      CONCURRENCY: ${CONCURRENCY:-4}
      OSM_URL: ${OSM_URL:-}
      OSM_FILE: ${OSM_FILE:-}
      COASTLINE_URL: ${COASTLINE_URL:-}
      COASTLINE_FILE: ${COASTLINE_FILE:-}
      FORCE_OSM_DOWNLOAD: ${FORCE_OSM_DOWNLOAD:-false}
      FORCE_COASTLINE_DOWNLOAD: ${FORCE_COASTLINE_DOWNLOAD:-false}
      SKIP_TILES: ${SKIP_TILES:-false}
    volumes:
      - ./out:/var/lib/motis
    entrypoint: ["bun", "/opt/transitous/motis/update_scheduler.ts"]
